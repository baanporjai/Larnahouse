<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ยอดขายตู้ — Frozen Larna Cake</title>
<link rel="icon" href="/favicon.gif" type="image/gif">
<link rel="manifest" href="/admin-manifest.json">
<meta name="theme-color" content="#1C0F08">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/admin-sw.js'));
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
<script>
const API_BASE = "https://larnaapi.yai-taweewoot.workers.dev";

// PIN gate — ใช้ sessionStorage key "dash_token" ตัวเดียวกับหน้าแอดมินอื่น (dashboard/customers/
// accounting/stock) เพื่อให้กรอก PIN ครั้งเดียวแล้วสลับแท็บไปมาได้ทั้งหมดโดยไม่ต้องกรอกซ้ำ
(function(){
  if (!sessionStorage.getItem("dash_token")) {
    document.addEventListener("DOMContentLoaded", function() {
      document.body.style.display = "none";
      var overlay = document.createElement("div");
      overlay.id = "pin-overlay";
      overlay.innerHTML = `
        <div style="position:fixed;inset:0;background:#2B1810;display:flex;align-items:center;justify-content:center;z-index:9999;">
          <div style="background:#fff;border-radius:20px;padding:40px 32px;width:320px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.3);">
            <div style="font-size:32px;margin-bottom:8px;">🔐</div>
            <h2 style="font-size:18px;font-weight:800;color:#2B1810;margin-bottom:4px;">Larna Dashboard</h2>
            <p style="font-size:13px;color:#888;margin-bottom:24px;">กรอก PIN เพื่อเข้าใช้งาน</p>
            <input id="pin-input" type="password" inputmode="numeric" maxlength="6"
              style="width:100%;text-align:center;font-size:28px;letter-spacing:8px;border:2px solid #e0d0c0;border-radius:12px;padding:12px;outline:none;color:#2B1810;"
              placeholder="••••••">
            <p id="pin-error" style="color:#c0392b;font-size:13px;margin-top:12px;display:none;">PIN ไม่ถูกต้อง ลองใหม่อีกครั้ง</p>
            <button onclick="checkPin()" style="margin-top:20px;width:100%;background:#2B1810;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;">เข้าสู่ระบบ</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      document.body.style.display = "";
      setTimeout(() => document.getElementById("pin-input").focus(), 100);
      document.getElementById("pin-input").addEventListener("keydown", function(e) {
        if (e.key === "Enter") checkPin();
      });
    });
  }
  window.checkPin = async function() {
    var input = document.getElementById("pin-input");
    var errorEl = document.getElementById("pin-error");
    errorEl.style.display = "none";
    try {
      const res = await fetch(API_BASE + "/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: input.value }),
      });
      const data = await res.json();
      if (data.success && data.token) {
        sessionStorage.setItem("dash_token", data.token);
        document.getElementById("pin-overlay").remove();
        init();
      } else {
        errorEl.style.display = "";
        input.value = ""; input.focus();
      }
    } catch (e) {
      errorEl.textContent = "เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง";
      errorEl.style.display = "";
    }
  };
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --choco-dark: #1C0F08;
    --choco: #4A2C1D;
    --choco-soft: #8A6A54;
    /* สีเน้นของหน้านี้เป็นโทนน้ำตาลโกโก้ ไม่ใช่ฟ้า --frost เหมือนหน้าแอดมินอื่น — เข้ากับ
       แบรนด์เค้กช็อกโกแลตกว่า ทั้งสองเฉดผ่านคอนทราสต์กับตัวอักษรสีขาวระดับ AA
       (cocoa 5.2:1, cocoa-deep 7.4:1) จึงใช้เป็นพื้นของ chip/แท่งกราฟที่มีตัวหนังสือทับได้ */
    --cocoa: #96603C;
    --cocoa-deep: #7A4A2B;
    --cocoa-tint: #E5CDB6; /* เฉดอ่อนสุดของ heatmap — ตัวหนังสือบนนี้ต้องเป็นสีเข้ม */
    --cream: #FBF3E7;
    --cream-2: #F0E3D1;
    --gold: #D4A64A;
    --green: #27ae60;
    --sorbet: #E85D4C;
    --sorbet-soft: #FCE7E3;
    --font-display: 'Prompt', sans-serif;
    --font-body: 'Prompt', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--cream); color: var(--choco-dark); min-height: 100vh; }

  header {
    background: var(--choco-dark);
    color: #fff;
    padding: 12px 28px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-family: var(--font-display); font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  header .nav-logo { height: 32px; width: auto; display: block; }
  .page-tabs { display: flex; gap: 2px; background: rgba(255,255,255,.1); border-radius: 30px; padding: 4px; justify-self: center; flex-wrap: wrap; }
  .page-tab {
    padding: 6px 16px; border-radius: 24px; font-size: 12px; font-weight: 700;
    text-decoration: none; color: rgba(255,255,255,.6); transition: all .2s; white-space: nowrap;
  }
  .page-tab.active { background: var(--cocoa); color: #fff; }
  .page-tab:not(.active):hover { color: #fff; }
  .bottom-nav { display: none; }
  .bnav-item {
    flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
    text-decoration: none; color: rgba(255,255,255,.6); font-size: 11px; font-weight: 700; padding: 4px 0;
  }
  .bnav-ico { font-size: 20px; line-height: 1; }
  .bnav-label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bnav-item.active { color: #fff; }
  .header-right { justify-self: end; display: flex; align-items: center; gap: 14px; }
  #lastUpdated { font-size: 12px; opacity: 0.5; }
  .refresh-btn {
    background: rgba(255,255,255,0.12);
    border: none; color: #fff; border-radius: 8px;
    padding: 6px 14px; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: background .15s;
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.22); }
  .refresh-btn:disabled { opacity: .5; cursor: wait; }

  /* Chocolate-drip divider — ลายเซ็นเดียวกับหน้าแอดมินอื่น */
  .drip-divider {
    position: absolute; left: 0; right: 0; top: 100%; height: 16px;
    background: var(--choco-dark);
    -webkit-mask: radial-gradient(circle at 9px 0, transparent 9px, black 9.5px) repeat-x;
    mask: radial-gradient(circle at 9px 0, transparent 9px, black 9.5px) repeat-x;
    -webkit-mask-size: 18px 16px;
    mask-size: 18px 16px;
    pointer-events: none;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

  /* ── ALERTS ── */
  .alert-banner {
    background: var(--sorbet-soft); border: 1.5px solid rgba(232,93,76,.35);
    color: #a3382a; border-radius: 14px; padding: 14px 18px;
    font-size: 13px; font-weight: 700; margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .alert-banner.warn {
    background: #FDF4E0; border-color: rgba(212,166,74,.45); color: #8A6215;
  }

  /* ── MACHINE FILTER ── */
  .machine-filter-bar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    background: #fff; border-radius: 14px; padding: 12px 18px; margin-bottom: 18px;
    box-shadow: 0 2px 12px rgba(43,24,16,0.07);
  }
  .machine-filter-label { font-size: 13px; font-weight: 700; color: var(--choco-dark); display: flex; align-items: center; gap: 8px; }

  /* ── STAT CARDS ── */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 16px; margin-bottom: 24px;
  }
  .stat-card { background: #fff; border-radius: 16px; padding: 20px 22px; box-shadow: 0 2px 12px rgba(43,24,16,0.07); }
  .stat-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--choco); opacity: 0.5; margin-bottom: 8px;
  }
  .stat-value {
    font-family: var(--font-display); font-size: 32px; font-weight: 700;
    color: var(--choco-dark); line-height: 1; font-variant-numeric: tabular-nums;
  }
  .stat-unit { font-size: 13px; font-weight: 400; opacity: 0.45; margin-top: 4px; }
  .stat-card.highlight { background: linear-gradient(135deg, var(--choco-dark) 0%, #A9714B 170%); }
  .stat-card.highlight .stat-label { color: rgba(255,255,255,.75); }
  .stat-card.highlight .stat-value { color: #fff; }
  .stat-card.highlight .stat-unit { color: rgba(255,255,255,0.5); }

  /* ── SPOTLIGHT ── */
  .spotlight {
    background: linear-gradient(135deg, var(--choco-dark) 0%, var(--choco) 100%);
    color: #fff; border-radius: 18px; padding: 22px 26px; margin-bottom: 24px;
    display: flex; align-items: center; gap: 20px;
    box-shadow: 0 4px 20px rgba(43,24,16,0.18);
  }
  .spotlight-trophy { font-size: 40px; line-height: 1; }
  .spotlight-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.6); }
  .spotlight-day { font-family: var(--font-display); font-size: 21px; font-weight: 700; margin-top: 4px; }
  .spotlight-sub { font-size: 13px; color: var(--gold); margin-top: 3px; font-weight: 600; }

  /* ── CARDS / CHARTS ── */
  .cards-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .cards-1col { margin-bottom: 24px; }
  .card { background: #fff; border-radius: 16px; padding: 22px 24px; box-shadow: 0 2px 12px rgba(43,24,16,0.07); }
  .card h3 {
    font-family: var(--font-display); font-size: 17px; font-weight: 600;
    font-style: italic; color: var(--choco-dark);
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px; flex-wrap: wrap; gap: 8px;
  }
  .card-badge {
    background: var(--cream-2); color: var(--choco); border-radius: 999px;
    padding: 4px 12px; font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .month-select {
    font-family: inherit; font-size: 12px; font-weight: 600;
    color: var(--choco-dark); background: var(--cream-2); border: none;
    border-radius: 20px; padding: 5px 12px; cursor: pointer; outline: none;
  }
  .metric-toggle { display: flex; gap: 2px; background: var(--cream-2); border-radius: 20px; padding: 3px; flex-wrap: wrap; }
  .metric-toggle button {
    border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 700;
    color: var(--choco-soft); padding: 4px 12px; border-radius: 16px; transition: all .15s;
  }
  .metric-toggle button.active { background: var(--cocoa); color: #fff; }

  /* ── DAILY CALENDAR ── */
  .calendar-weekdays { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; margin-bottom: 6px; }
  .calendar-weekdays div { text-align: center; font-size: 11px; font-weight: 700; color: var(--choco-soft); }
  .calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }
  .cal-cell {
    aspect-ratio: 1; border-radius: 8px; background: var(--cream-2); position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .cal-cell:hover { transform: scale(1.06); z-index: 2; }
  .cal-cell.out-of-range { opacity: .3; }
  .cal-cell .cc-date { position: absolute; top: 4px; left: 6px; font-size: 9px; color: var(--choco-soft); }
  .cal-cell .cc-count { font-size: 12px; font-weight: 700; color: var(--choco-dark); margin-top: 6px; }
  .cal-cell .cc-bills { position: absolute; bottom: 3px; right: 5px; font-size: 8px; color: var(--choco-soft); line-height: 1; }
  .cal-cell.p1 { background: var(--cocoa-deep); }
  .cal-cell.p2 { background: var(--cocoa); }
  .cal-cell.p1 .cc-count, .cal-cell.p1 .cc-date, .cal-cell.p1 .cc-bills,
  .cal-cell.p2 .cc-count, .cal-cell.p2 .cc-date, .cal-cell.p2 .cc-bills { color: #fff; }
  .cal-cell.p3 { background: var(--cocoa-tint); }
  @media(max-width:600px){ .cal-cell .cc-date { font-size: 8px; } .cal-cell .cc-count { font-size: 11px; } }

  .heatmap-legend { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--choco-soft); }
  .legend-scale { display: flex; gap: 4px; }
  .legend-dot { width: 14px; height: 14px; border-radius: 4px; }

  /* ── HOUR HEATMAP ── */
  .hour-grid { display: grid; grid-template-columns: repeat(12,1fr); gap: 5px; }
  @media(max-width:600px){ .hour-grid { grid-template-columns: repeat(8,1fr); } }
  .hour-cell {
    aspect-ratio: 1; border-radius: 8px; background: var(--cream-2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .hour-cell .hc-count { font-size: 12px; font-weight: 700; color: var(--choco-dark); line-height: 1; }
  .hour-cell .hc-lbl { font-size: 8px; color: var(--choco-soft); margin-top: 2px; }
  .hour-cell.p1 { background: var(--cocoa-deep); }
  .hour-cell.p2 { background: var(--cocoa); }
  .hour-cell.p1 .hc-count, .hour-cell.p1 .hc-lbl,
  .hour-cell.p2 .hc-count, .hour-cell.p2 .hc-lbl { color: #fff; }
  .hour-cell.p3 { background: var(--cocoa-tint); }

  /* ── COMPARISON ── */
  .compare-row {
    display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--cream-2);
  }
  .compare-row:last-child { border-bottom: none; }
  .compare-row.clickable { cursor: pointer; }
  .compare-row.clickable:hover { background: var(--cream); }
  .compare-label { font-size: 13px; font-weight: 700; color: var(--choco-dark); }
  .compare-values { font-size: 12px; color: var(--choco); opacity: .6; margin-top: 2px; }
  .compare-delta { font-weight: 800; padding: 5px 12px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .compare-delta.up { background: #d4edda; color: #155724; }
  .compare-delta.down { background: #f8d7da; color: #842029; }
  .compare-delta.flat { background: var(--cream-2); color: var(--choco); }

  /* ── BEST DAYS ── */
  .day-list { display: flex; flex-direction: column; gap: 10px; }
  .day-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .day-bar-outer { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; }
  .day-label { font-size: 12px; color: var(--choco); opacity: .65; }
  .day-bar-wrap { background: var(--cream-2); border-radius: 20px; height: 10px; overflow: hidden; }
  .day-bar { height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--cocoa-deep), var(--cocoa)); transition: width .8s cubic-bezier(.4,0,.2,1); }
  .day-bar.top { background: linear-gradient(90deg, var(--gold), #F0D28A); }
  .day-count { font-size: 13px; font-weight: 800; color: var(--cocoa-deep); min-width: 34px; text-align: right; }

  /* ── PAYMENT PILLS ── */
  .pay-pills { display: flex; flex-direction: column; gap: 14px; }
  .pay-pill { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px; }
  .pay-emoji { font-size: 22px; }
  .pay-name { font-size: 13px; font-weight: 600; color: var(--choco-dark); }
  .pay-bar-wrap { background: var(--cream-2); border-radius: 20px; height: 8px; margin-top: 5px; overflow: hidden; }
  .pay-bar-fill { height: 100%; border-radius: 20px; transition: width .9s cubic-bezier(.4,0,.2,1); }
  .pay-pct { font-size: 13px; font-weight: 700; color: var(--choco-soft); min-width: 40px; text-align: right; }

  /* ── BILL LIST ── */
  .bill-row {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: start;
    padding: 13px 0; border-bottom: 1px solid var(--cream-2); cursor: pointer;
  }
  .bill-row:last-child { border-bottom: none; }
  .bill-row:hover { background: var(--cream); }
  .bill-when { font-size: 13px; font-weight: 700; color: var(--choco-dark); }
  .bill-items { font-size: 12px; color: var(--choco); opacity: .7; margin-top: 3px; }
  .bill-meta { font-size: 11px; color: var(--choco-soft); margin-top: 3px; }
  .bill-total { font-size: 15px; font-weight: 800; color: var(--choco-dark); white-space: nowrap; }

  .empty { text-align: center; color: var(--choco); opacity: 0.35; padding: 32px 0; font-size: 14px; }
  .loading-state { text-align: center; padding: 80px 0; color: var(--choco); opacity: 0.4; font-size: 15px; }
  .error-state {
    background: #fff0f0; border-radius: 16px; padding: 28px;
    text-align: center; color: #c0392b; font-size: 14px; margin-top: 20px;
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(43,24,16,0.45);
    z-index: 100; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 20px; padding: 28px; width: 100%; max-width: 560px;
    max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(43,24,16,0.18); position: relative;
  }
  .modal h3 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .modal-sub { font-size: 12px; color: var(--choco); opacity: .55; margin-bottom: 18px; }
  .modal-close {
    position: absolute; top: 18px; right: 20px;
    background: var(--cream-2); border: none; border-radius: 50%;
    width: 32px; height: 32px; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .modal-row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--cream-2); font-size: 13px;
  }
  .modal-row:last-child { border-bottom: none; }
  .modal-row .v { font-weight: 700; white-space: nowrap; }

  footer { text-align: center; padding: 10px 20px 40px; font-size: 12px; color: var(--choco-soft); }

  @media (max-width: 680px) {
    .cards-2col { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    header { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .header-right { justify-self: center; }
    .page-tabs { display: none; }
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around;
      background: var(--choco-dark);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      box-shadow: 0 -2px 12px rgba(43,24,16,.18);
    }
    body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  }
  @media (max-width: 400px) {
    .stats { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1><img class="nav-logo" src="/larna-logo.jpg" alt="Larna Frozen Cake">🥤 ยอดขายตู้</h1>
  <div class="page-tabs">
    <span class="page-tab active">ยอดขายตู้</span>
    <a href="/dashboard.html" class="page-tab">ยอดสั่งซื้อ</a>
    <a href="/customers.html" class="page-tab">ประวัติลูกค้า</a>
    <a href="/accounting.html" class="page-tab">บัญชี</a>
    <a href="/stock.html" class="page-tab">สต็อกสินค้า</a>
  </div>
  <div class="header-right">
    <span id="lastUpdated">กำลังโหลด...</span>
    <button class="refresh-btn" id="refreshBtn" onclick="init()">🔄 รีเฟรช</button>
  </div>
  <div class="drip-divider" aria-hidden="true"></div>
</header>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="modalTitle"></h3>
    <div class="modal-sub" id="modalSub"></div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="container">
  <div id="content"><div class="loading-state">กำลังโหลดข้อมูล...</div></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// ยอดขายตู้ — อ่านจากแท็บ "inbox" ของสเปรดชีต Larna Orders (Ksher payment gateway
// เป็นคนเติมข้อมูลเข้ามาเอง ไม่มีใครกรอกมือ) ผ่าน Worker /api/admin/machine-sales
//
// โครงสร้างข้อมูลที่ต้องระวัง 3 อย่าง:
//   1. 1 แถว = 1 บรรทัดสินค้า ไม่ใช่ 1 บิล — บิลที่ซื้อ 2 อย่างมี 2 แถว "transactionid" ซ้ำกัน
//      ⇒ "จำนวนบิล" ต้องนับ transactionid ที่ไม่ซ้ำ ไม่ใช่นับจำนวนแถว
//   2. ชื่อสินค้าอาจมีจำนวนนำหน้า ("3 x มินิ ลาร์นา เค้ก") ⇒ จำนวนชิ้นต้องดึงจากชื่อ ไม่ใช่นับแถว
//   3. status มีทั้ง paid / pending (ลูกค้ากดสั่งแต่จ่ายไม่สำเร็จ) ⇒ ยอดขายนับแค่ paid
//      แต่ยังโชว์จำนวน pending ไว้เตือน เพราะ pending เยอะผิดปกติ = ระบบจ่ายเงินตู้มีปัญหา
// ═══════════════════════════════════════════════════════════════════════════

const charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }
function destroyAllCharts() { Object.keys(charts).forEach(destroyChart); }

// ── PARSE ────────────────────────────────────────────────────────────────

// ข้อความทุกอย่างในหน้านี้มาจากชีตที่ Ksher เขียน (ชื่อสินค้า/ชื่อตู้/วิธีจ่ายเงิน) ไม่ได้มาจากเราเอง
// — ผ่าน esc() ก่อนแปะลง innerHTML ทุกครั้ง กัน HTML ในค่าข้อมูลไปพังโครงหน้า
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function toNum(v) {
  if (typeof v === "number") return v;
  const n = parseFloat(String(v == null ? "" : v).replace(/[^0-9.-]/g, ""));
  return isNaN(n) ? 0 : n;
}

// Apps Script ส่ง "Transaction Date" มาเป็น "YYYY-MM-DD HH:MM:SS" (ดู formatSheetDateTime_)
// แต่รองรับรูปแบบอื่นไว้ด้วยเผื่อค่าในชีตเป็น text ดิบจาก Ksher ("16/08/2026 23:02:34") หรือ
// ISO เต็มรูปแบบ — จงใจไม่ยก new Date(str) มาใช้กับรูปแบบ D/M/YYYY เพราะเบราว์เซอร์จะตีความ
// เป็น M/D/YYYY แบบอเมริกาเงียบๆ ทุกครั้งที่วันที่ <= 12 (บั๊กเดียวกับที่ parseTimestamp()
// ในหน้า dashboard ต้องมาดักไว้)
function parseSaleDate(raw) {
  if (!raw) return null;
  const s = String(raw).trim();

  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})[T\s](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));

  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) {
    const year = +m[3] > 2500 ? +m[3] - 543 : +m[3]; // เผื่อปีพ.ศ.
    return new Date(year, +m[2] - 1, +m[1], +m[4], +m[5], +(m[6] || 0));
  }

  const d = new Date(s);
  return isNaN(d) ? null : d;
}

// ดึง "ชั่วโมง" จากตัวหนังสือในชีตตรงๆ ไม่ใช่จาก Date.getHours() — เวลาในชีตเป็นเวลาไทยเสมอ
// แต่ getHours() อ่านค่าตาม timezone ของเครื่องที่เปิดหน้านี้ ถ้าเปิดจากต่างประเทศชั่วโมงจะเพี้ยน
function parseSaleHour(raw, fallbackDate) {
  const m = String(raw || "").match(/[T\s](\d{1,2}):\d{2}/);
  if (m) return +m[1];
  return fallbackDate ? fallbackDate.getHours() : null;
}

// "3 x มินิ ลาร์นา เค้ก (ออริจินัล)" → { qty: 3, name: "มินิ ลาร์นา เค้ก (ออริจินัล)" }
// รองรับรูปแบบ "ชื่อ x3" ด้วย (รูปแบบที่แท็บ Orders ของเว็บใช้) เผื่อ Ksher เปลี่ยนรูปแบบวันหลัง
function parseProduct(raw) {
  const s = String(raw == null ? "" : raw).trim();
  if (!s) return { qty: 1, name: "(ไม่ระบุสินค้า)" };
  let m = s.match(/^(\d+)\s*[x×]\s*(.+)$/i);
  if (m) return { qty: +m[1], name: m[2].trim() };
  m = s.match(/^(.+?)\s*[x×]\s*(\d+)$/i);
  if (m) return { qty: +m[2], name: m[1].trim() };
  return { qty: 1, name: s };
}

function normalizeRow(r) {
  const rawDate = r.transactiondate;
  const datetime = parseSaleDate(rawDate);
  const { qty, name } = parseProduct(r.productname);
  return {
    datetime,
    hour: parseSaleHour(rawDate, datetime),
    txId: String(r.transactionid || "").trim(),
    kiosk: String(r.kioskname || r.kioskid || "").trim(),
    payment: String(r.paymentmethod || "").trim() || "อื่นๆ",
    status: String(r.status || "").trim().toLowerCase(),
    product: name,
    qty,
    amount: toNum(r.grandtotal),
  };
}

// รวมแถวสินค้าเป็น "บิล" ตาม transactionid — บิลไหนไม่มี transactionid (ไม่ควรเกิด แต่กันไว้)
// ให้ถือเป็นบิลเดี่ยวของตัวเอง โดยใช้ index กำกับ ไม่ให้ไปยุบรวมกับแถวอื่นที่ id ว่างเหมือนกัน
function groupBills(rows) {
  const bills = new Map();
  rows.forEach((r, i) => {
    const key = r.txId || `__no_id_${i}`;
    if (!bills.has(key)) {
      bills.set(key, { id: r.txId, datetime: r.datetime, hour: r.hour, kiosk: r.kiosk,
                       payment: r.payment, status: r.status, items: [], total: 0, qty: 0 });
    }
    const b = bills.get(key);
    b.items.push({ name: r.product, qty: r.qty, amount: r.amount });
    b.total += r.amount;
    b.qty += r.qty;
    if (r.datetime && (!b.datetime || r.datetime < b.datetime)) b.datetime = r.datetime;
  });
  return Array.from(bills.values());
}

function renderMachineFilter() {
  machineList = Array.from(new Set(allRows.map(r => r.kiosk).filter(Boolean))).sort();
  const wrap = document.getElementById("machineFilterWrap");
  if (machineList.length < 2) { wrap.style.display = "none"; return; }
  wrap.style.display = "";
  document.getElementById("machineFilterTabs").innerHTML = [
    `<button type="button" data-machine="all" onclick="onMachineFilterChange('all')">ทุกตู้</button>`,
    ...machineList.map((m, i) => `<button type="button" data-machine="${esc(m)}" onclick="onMachineFilterChange(${i})">${esc(m)}</button>`),
  ].join("");
  document.querySelectorAll("#machineFilterTabs button")
    .forEach(b => b.classList.toggle("active", b.dataset.machine === machineFilter));
}

// ── ALERTS ───────────────────────────────────────────────────────────────
const SILENCE_ALERT_HOURS = 24;

function renderAlerts() {
  const out = [];
  const latest = rows.length ? new Date(Math.max(...rows.map(r => r.datetime.getTime()))) : null;

  if (latest) {
    const hours = Math.floor((Date.now() - latest.getTime()) / 3600000);
    if (hours >= SILENCE_ALERT_HOURS) {
      out.push(`<div class="alert-banner"><span>⚠️</span><span>ไม่มียอดขายจากตู้มา ${hours} ชั่วโมงแล้ว —
        ลองเช็คว่าตู้ยังทำงานปกติ ของในตู้ยังไม่หมด และระบบจ่ายเงินยังใช้ได้อยู่</span></div>`);
    }
  }

  // pending = ลูกค้ากดสั่งแล้วจ่ายเงินไม่สำเร็จ มีบ้างเป็นเรื่องปกติ (กดยกเลิก/สแกนไม่ทัน)
  // แต่ถ้าเยอะเทียบกับบิลที่จ่ายสำเร็จ = สัญญาณว่าระบบจ่ายเงินหน้าตู้มีปัญหา
  if (pendingBillCount > 0) {
    out.push(`<div class="alert-banner warn"><span>ℹ️</span><span>มี ${pendingBillCount} บิลที่จ่ายเงินไม่สำเร็จ (pending)
      — ไม่ถูกนับเป็นยอดขายในหน้านี้</span></div>`);
  }

  document.getElementById("alerts").innerHTML = out.join("");
}

    <div class="stat-card">
      <div class="stat-label">ชั่วโมงยอดนิยม</div>
      <div class="stat-value">${peakHour == null ? "—" : peakHour + ":00"}</div>
      <div class="stat-unit">ซื้อมากที่สุดช่วงนี้</div>
    </div>
  `;
}

// จัดกลุ่มยอดขายรายวัน — คืน array เรียงจากขายดีสุด ใช้ทั้ง spotlight, "7 วันที่ขายดีที่สุด"
// และ KPI "สูงสุดในวันเดียว" (นับเป็น "ชิ้น" ไม่ใช่ "บิล" เพราะบิลเดียวซื้อได้หลายชิ้น)
function dailyTotals() {
  const map = {};
  rows.forEach(r => {
    const k = r.datetime.toDateString();
    if (!map[k]) map[k] = { date: new Date(r.datetime), qty: 0, revenue: 0 };
    map[k].qty += r.qty;
    map[k].revenue += r.amount;
  });
  return Object.values(map).sort((a, b) => b.qty - a.qty || b.revenue - a.revenue);
}

function renderSpotlight() {
  const best = dailyTotals()[0];
  const el = document.getElementById("spotlight");
  if (!best) { el.style.display = "none"; return; }
  el.style.display = "";
  document.getElementById("spotlightDay").textContent =
    best.date.toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  document.getElementById("spotlightSub").textContent =
    `ขายได้ ${best.qty} ชิ้น · ${fmtBaht(best.revenue)} ในวันเดียว 🔥`;
}

// ── DAILY CALENDAR ───────────────────────────────────────────────────────
function onDailyMonthChange(val) { dailyMonthFilter = val; renderDailyCalendar(); }
function onDailyMetricChange(m) { dailyMetric = m; renderDailyCalendar(); }

// dropdown เลือกเดือนของทุกการ์ด: จำค่าที่ผู้ใช้เลือกไว้ถ้าเดือนนั้นยังมีอยู่ในข้อมูลชุดใหม่
// (เช่นหลังกดรีเฟรช/สลับตู้) ไม่งั้นตกกลับไปค่าเริ่มต้น
function populateMonthSelect(id, current, fallback, fallbackLabel) {
  const months = Array.from(new Set(rows.map(r => monthKey(r.datetime)))).sort();
  const sel = document.getElementById(id);
  sel.innerHTML = `<option value="${fallback}">${fallbackLabel}</option>` +
    months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join("");
  const stillExists = Array.from(sel.options).some(o => o.value === current);
  sel.value = stillExists ? current : fallback;
  return sel.value;
}

function renderDailyCalendar() {
  dailyMonthFilter = populateMonthSelect("dailyMonthFilter", dailyMonthFilter, "recent30", "30 วันล่าสุด");
  const useMoney = dailyMetric === "money";

  let rangeStart, rangeEnd; // inclusive ทั้งคู่ เทียบกันที่เที่ยงคืนเวลาท้องถิ่น
  if (dailyMonthFilter === "recent30") {
    rangeEnd = new Date(); rangeEnd.setHours(0, 0, 0, 0);
    rangeStart = new Date(rangeEnd); rangeStart.setDate(rangeStart.getDate() - 29);
  } else {
    const [y, mo] = dailyMonthFilter.split("-").map(Number);
    rangeStart = new Date(y, mo - 1, 1);
    rangeEnd = new Date(y, mo, 0); // วันสุดท้ายของเดือน
  }

  // ขยายขอบเขตให้ครบสัปดาห์เต็ม (อาทิตย์–เสาร์) เพื่อวางเป็นตารางปฏิทินได้พอดี
  const gridStart = new Date(rangeStart); gridStart.setDate(gridStart.getDate() - gridStart.getDay());
  const gridEnd = new Date(rangeEnd); gridEnd.setDate(gridEnd.getDate() + (6 - gridEnd.getDay()));

  const values = {}, billCounts = {};
  rows.forEach(r => {
    const k = r.datetime.toDateString();
    values[k] = (values[k] || 0) + (useMoney ? r.amount : r.qty);
  });
  bills.forEach(b => {
    if (!b.datetime) return;
    const k = b.datetime.toDateString();
    billCounts[k] = (billCounts[k] || 0) + 1;
  });

  const cells = [];
  for (let d = new Date(gridStart); d <= gridEnd; d.setDate(d.getDate() + 1)) {
    const inRange = d >= rangeStart && d <= rangeEnd;
    const k = d.toDateString();
    cells.push({ date: new Date(d), inRange, value: inRange ? (values[k] || 0) : null, bills: inRange ? (billCounts[k] || 0) : null });
  }

  const inRangeValues = cells.filter(c => c.inRange).map(c => c.value);
  const maxV = inRangeValues.length ? Math.max(...inRangeValues) : 0;

  document.getElementById("dailyWeekdays").innerHTML =
    ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"].map(l => `<div>${l}</div>`).join("");

  document.getElementById("dailyCalendar").innerHTML = cells.map(c => {
    if (!c.inRange) return `<div class="cal-cell out-of-range"><div class="cc-date">${c.date.getDate()}</div></div>`;
    const p = maxV > 0 ? c.value / maxV : 0;
    const cls = c.value === 0 ? "" : (p >= .85 ? "p1" : p >= .55 ? "p2" : p >= .25 ? "p3" : "");
    const label = c.value === 0 ? "" : (useMoney ? fmtBaht(c.value) : c.value);
    const badge = c.bills > 0 ? `<div class="cc-bills" title="จำนวนบิล">🧾${c.bills}</div>` : "";
    return `<div class="cal-cell ${cls}">
      <div class="cc-date">${c.date.getDate()}</div>
      <div class="cc-count">${label}</div>
      ${badge}
    </div>`;
  }).join("");

  const avg = inRangeValues.length ? inRangeValues.reduce((a, b) => a + b, 0) / inRangeValues.length : 0;
  document.getElementById("dailyBadge").textContent = useMoney
    ? `เฉลี่ย ${fmtBaht(avg)}/วัน`
    : `เฉลี่ย ${avg.toFixed(1)} ชิ้น/วัน`;

  document.querySelectorAll("#dailyMetricToggle button")
    .forEach(b => b.classList.toggle("active", b.dataset.metric === dailyMetric));
}

function renderMonthlyChart() {

// ── WEEKDAY ──────────────────────────────────────────────────────────────
function onWeekdayMonthChange(val) { weekdayMonthFilter = val; renderWeekdayChart(); }
function onWeekdayMetricChange(m) { weekdayMetric = m; renderWeekdayChart(); }

function renderWeekdayChart() {
  destroyChart("weekday");
  weekdayMonthFilter = populateMonthSelect("weekdayMonthFilter", weekdayMonthFilter, "all", "ทั้งหมด");
  const filtered = weekdayMonthFilter === "all" ? rows : rows.filter(r => monthKey(r.datetime) === weekdayMonthFilter);

  const counts = Array(7).fill(0);
  filtered.forEach(r => counts[r.datetime.getDay()] += r.qty);

  // นับจำนวนครั้งที่แต่ละวันในสัปดาห์ "เกิดขึ้นจริง" ในช่วงที่เลือก เพื่อใช้หารหาค่าเฉลี่ย —
  // ไม่หารด้วย 7 หรือด้วยจำนวนวันที่มียอดขาย เพราะวันที่ตู้ไม่ขายอะไรเลยก็ต้องนับเป็น 0 ด้วย
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let occStart, occEnd;
  if (weekdayMonthFilter === "all") {
    if (!filtered.length) { occStart = new Date(today); occEnd = new Date(today); }
    else {
      occStart = new Date(Math.min(...filtered.map(r => r.datetime.getTime())));
      occEnd = new Date(Math.min(Math.max(...filtered.map(r => r.datetime.getTime())), today.getTime()));
    }
  } else {
    const [y, mo] = weekdayMonthFilter.split("-").map(Number);
    occStart = new Date(y, mo - 1, 1);
    occEnd = new Date(Math.min(new Date(y, mo, 0).getTime(), today.getTime()));
  }
  occStart.setHours(0, 0, 0, 0); occEnd.setHours(0, 0, 0, 0);
  const occCounts = Array(7).fill(0);
  for (let d = new Date(occStart); d <= occEnd; d.setDate(d.getDate() + 1)) occCounts[d.getDay()]++;
  const averages = counts.map((c, i) => occCounts[i] ? c / occCounts[i] : 0);

  const isAvg = weekdayMetric === "avg";
  const data = isAvg ? averages.map(v => Math.round(v * 10) / 10) : counts;
  const max = Math.max(...data);

  document.querySelectorAll("#weekdayMetricToggle button")
    .forEach(b => b.classList.toggle("active", b.dataset.metric === weekdayMetric));

  charts.weekday = new Chart(document.getElementById("chartWeekday"), {
    type: "bar",
    data: { labels: ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"], datasets: [{
      data,
      backgroundColor: data.map(v => v === max && max > 0 ? "#7A4A2B" : "rgba(150,96,60,.5)"),
      borderRadius: 8, borderSkipped: false,
    }] },
    options: { ...chartDefaults, plugins: { legend: { display: false }, tooltip: {
      callbacks: { label: c => isAvg
        ? ` เฉลี่ย ${averages[c.dataIndex].toFixed(1)} ชิ้น/วัน (จาก ${occCounts[c.dataIndex]} วัน, รวม ${counts[c.dataIndex]} ชิ้น)`
        : ` ${c.raw} ชิ้น` },
    } } },
  });
}

// ── COMPARISON ───────────────────────────────────────────────────────────
function sumInRange(fromMs, toMs) {
  return rows.reduce((acc, r) => {
    const t = r.datetime.getTime();
    if (t >= fromMs && t < toMs) { acc.qty += r.qty; acc.revenue += r.amount; }
    return acc;
  }, { qty: 0, revenue: 0 });
}

function renderComparison() {
  const now = Date.now(), DAY = 86400000;
  const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
  const todayMs = startOfToday.getTime();

  const periods = [
    { label: "วันนี้ vs เมื่อวาน (ถึงเวลานี้)",
      cur: sumInRange(todayMs, now),
      prev: sumInRange(todayMs - DAY, todayMs - DAY + (now - todayMs)) },
    { label: "7 วันล่าสุด vs 7 วันก่อนหน้า",
      cur: sumInRange(now - 7 * DAY, now), prev: sumInRange(now - 14 * DAY, now - 7 * DAY) },
    { label: "30 วันล่าสุด vs 30 วันก่อนหน้า",
      cur: sumInRange(now - 30 * DAY, now), prev: sumInRange(now - 60 * DAY, now - 30 * DAY) },
  ];

  document.getElementById("compareList").innerHTML = periods.map(p => {
    let pct, cls;
    if (p.prev.revenue > 0) {
      pct = (p.cur.revenue - p.prev.revenue) / p.prev.revenue * 100;
      cls = pct > 0.5 ? "up" : pct < -0.5 ? "down" : "flat";
    } else {
      pct = p.cur.revenue > 0 ? 100 : 0;
      cls = p.cur.revenue > 0 ? "up" : "flat";
    }
    const arrow = cls === "up" ? "↑" : cls === "down" ? "↓" : "→";
    return `
    <div class="compare-row">
      <div>
        <div class="compare-label">${p.label}</div>
        <div class="compare-values">${fmtBaht(p.cur.revenue)} (${p.cur.qty} ชิ้น) เทียบกับ ${fmtBaht(p.prev.revenue)}</div>
      </div>
      <div class="compare-delta ${cls}">${arrow} ${Math.abs(pct).toFixed(0)}%</div>
    </div>`;
  }).join("");
}

// ── HOUR HEATMAP ─────────────────────────────────────────────────────────
function onHeatmapMonthChange(val) { heatmapMonthFilter = val; renderHeatmap(); }

function renderHeatmap() {
  heatmapMonthFilter = populateMonthSelect("heatmapMonthFilter", heatmapMonthFilter, "all", "ทั้งหมด");
  const filtered = heatmapMonthFilter === "all" ? rows : rows.filter(r => monthKey(r.datetime) === heatmapMonthFilter);
  const counts = Array(24).fill(0);
  filtered.forEach(r => { if (r.hour != null) counts[r.hour] += r.qty; });
  const max = Math.max(...counts), peak = counts.indexOf(max);

  document.getElementById("hourGrid").innerHTML = counts.map((cnt, h) => {
    const p = max > 0 ? cnt / max : 0;

    return `<div class="hour-cell ${cls}">
      <div class="hc-count">${cnt || ""}</div>
      <div class="hc-lbl">${h}:00</div>
    </div>`;
  }).join("");

  document.getElementById("peakHourBadge").textContent = max > 0
    ? `🔥 ยอดฮิต ${peak}:00–${peak + 1}:00`
    : "ไม่มีข้อมูล";
}

// ── BILL LIST ────────────────────────────────────────────────────────────
const BILL_LIST_LIMIT = 25;

function renderBillList() {
  const recent = bills.slice()
    .sort((a, b) => (b.datetime ? b.datetime.getTime() : 0) - (a.datetime ? a.datetime.getTime() : 0))
    .slice(0, BILL_LIST_LIMIT);
  window._recentBills = recent;

  document.getElementById("billBadge").textContent = `${bills.length.toLocaleString("th-TH")} บิลทั้งหมด`;
  document.getElementById("billList").innerHTML = recent.length ? recent.map((b, i) => `
    <div class="bill-row" onclick="showBill(${i})">
      <div>
        <div class="bill-when">${b.datetime ? fmtDateTime(b.datetime) : "—"}</div>
        <div class="bill-items">🛍 ${b.items.map(it => `${esc(it.name)}${it.qty > 1 ? ` ×${it.qty}` : ""}`).join(", ")}</div>
        <div class="bill-meta">${payInfo(b.payment).emoji} ${esc(payInfo(b.payment).label)}${b.kiosk ? ` · ${esc(b.kiosk)}` : ""}</div>
      </div>
      <div class="bill-total">${fmtBaht(b.total)}</div>
    </div>`).join("") : '<div class="empty">ยังไม่มีบิลจากตู้</div>';
}

function showBill(i) {
  const b = (window._recentBills || [])[i];
  if (!b) return;
  document.getElementById("modalTitle").textContent = "🧾 " + (b.datetime ? fmtDateTime(b.datetime) : "บิลจากตู้");
  document.getElementById("modalSub").textContent =
    `${b.items.reduce((s, it) => s + it.qty, 0)} ชิ้น · ${fmtBaht(b.total)} · ${payInfo(b.payment).label}` +
    `${b.kiosk ? ` · ตู้ ${b.kiosk}` : ""}${b.id ? ` · ${b.id}` : ""}`;
  document.getElementById("modalBody").innerHTML = b.items.map(it => `
    <div class="modal-row">
      <span>${esc(it.name)}${it.qty > 1 ? ` ×${it.qty}` : ""}</span>
      <span class="v">${fmtBaht(it.amount)}</span>
    </div>`).join("");
  document.getElementById("modalOverlay").classList.add("open");
}

function closeModal(e) {
  if (e && e.target !== document.getElementById("modalOverlay") && !e.target.classList.contains("modal-close")) return;
  document.getElementById("modalOverlay").classList.remove("open");
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("modalOverlay").classList.remove("open");
});

  const latest = rows.length ? new Date(Math.max(...rows.map(r => r.datetime.getTime()))) : null;
  document.getElementById("footerNote").innerHTML = latest
    ? `🍰 Frozen Larna Cake · ข้อมูลจากตู้ (Ksher) ล่าสุด ${fmtDateTime(latest)}`
    : "🍰 Frozen Larna Cake · ยอดขายตู้";

  const now = new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("lastUpdated").textContent = `อัพเดต ${now} น.`;
}

// ── LOAD ─────────────────────────────────────────────────────────────────
async function loadData() {
  const token = sessionStorage.getItem("dash_token");
  const res = await fetch(API_BASE + "/api/admin/machine-sales", {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (res.status === 401) {
    sessionStorage.removeItem("dash_token");
    location.reload();
    throw new Error("Unauthorized");
  }
  const json = await res.json();
  if (json.error) throw new Error(json.error);

  const normalized = (json.sales || [])
    .map(normalizeRow)
    .filter(r => r.datetime && !isNaN(r.datetime));

  // ยอดขายนับแค่บิลที่จ่ายเงินสำเร็จ — pending เก็บไว้แค่จำนวนบิลเพื่อโชว์เป็นคำเตือน
  const paid = normalized.filter(r => r.status === "paid");
  pendingBillCount = new Set(
    normalized.filter(r => r.status && r.status !== "paid").map(r => r.txId).filter(Boolean)
  ).size;

  allRows = paid;
  allBills = groupBills(paid);
}

let refreshTimer;
async function init() {
  clearTimeout(refreshTimer);
  const btn = document.getElementById("refreshBtn");
  if (btn) btn.disabled = true;
  document.getElementById("lastUpdated").textContent = "กำลังโหลด...";
  try {
    await loadData();
    // สลับตู้ที่เลือกไว้กลับเป็น "ทุกตู้" ถ้าตู้นั้นหายไปจากข้อมูลชุดใหม่
    if (machineFilter !== "all" && !allRows.some(r => r.kiosk === machineFilter)) machineFilter = "all";
    applyMachineFilter();
    renderShell();
    render();
    // Ksher เขียนข้อมูลเข้าชีตแทบจะทันทีที่ลูกค้าจ่ายเงิน — รีเฟรชอัตโนมัติทุก 5 นาที
    // เท่าหน้ายอดสั่งซื้อ พอเห็นยอดใหม่ได้ไวโดยไม่ต้องคอยกดเอง
    refreshTimer = setTimeout(init, 5 * 60 * 1000);
  } catch (e) {
    console.log("machine-sales load failed:", e);
    document.getElementById("content").innerHTML = `
      <div class="error-state">
        โหลดข้อมูลยอดขายตู้ไม่ได้ — ตรวจสอบว่า Apps Script deploy เวอร์ชันล่าสุดแล้ว
        (ต้องมี action <b>machine-sales</b> และมีแท็บชื่อ <b>inbox</b> ในสเปรดชีต)<br><br>
        <button onclick="init()" style="margin-top:12px;padding:8px 20px;border-radius:8px;border:none;background:#c0392b;color:#fff;cursor:pointer;font-weight:700;">ลองใหม่</button>
      </div>`;
    document.getElementById("lastUpdated").textContent = "โหลดไม่สำเร็จ";
  } finally {
    if (btn) btn.disabled = false;
  }
}

if (sessionStorage.getItem("dash_token")) init();
</script>
